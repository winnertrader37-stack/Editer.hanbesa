<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naol Editer</title>
<style>
:root{--ac:#25f4ee;--pk:#fe2c55;--mu:#8a8a8e}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font:13px system-ui,sans-serif;max-width:560px;margin:auto;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.open{padding-bottom:calc(70px + 44vh)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.logo{font:900 18px system-ui;background:linear-gradient(90deg,var(--ac),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;gap:8px;align-items:center}
.q{background:#1c1c1e;color:#fff;border:0;border-radius:8px;padding:8px}
.exp{background:var(--ac);color:#000;border:0;border-radius:8px;padding:8px 16px;font-weight:800}
#cv{display:block;margin:auto;width:auto;max-width:100%;max-height:42vh;background:#000}
.ctrl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--mu)}
.ic{background:none;border:0;color:#fff;font-size:20px;padding:4px 10px;cursor:pointer}
.tlw{position:relative;padding:6px 0}
.ph{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;z-index:3;pointer-events:none}
.plus{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:8px;background:#fff;color:#000;font-size:26px;display:grid;place-items:center;z-index:4;cursor:pointer}
#sc{overflow-x:auto;padding:0 50%;scrollbar-width:none}#sc::-webkit-scrollbar{display:none}
#tin{position:relative;min-width:1px}
.r1{display:flex;height:48px}
.clip{flex:none;height:48px;background:#2a2a2e;border-right:2px solid #000;font-size:11px;overflow:hidden;white-space:nowrap;padding:4px;border-radius:6px}
.clip.on{outline:2px solid #fff;outline-offset:-2px}
.r2,.r3{position:relative;height:26px;margin-top:4px}
.ab{position:absolute;height:24px;border-radius:5px;font-size:11px;padding:4px 6px;overflow:hidden;white-space:nowrap;cursor:pointer}
.tx{background:#7a3cff}.tx.on{outline:2px solid #fff}.mu{background:#0a8f8a}.sf{background:#c2410c}
.act{display:none}.rul{display:flex;height:16px;font-size:10px;color:#8a8a8e;overflow:hidden}.rul span{flex:none;width:60px;border-left:1px solid #333;padding-left:2px}.clip{color:#fff;text-shadow:0 1px 3px #000}
.b{background:#2a2a2e;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 12px system-ui;cursor:pointer;margin:3px;display:inline-block}
.b:active{background:#3a3a40}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0}
.h{color:var(--ac);font-weight:700;margin:12px 0 4px}
.m{color:var(--mu);margin:8px 0}
#sheet{display:none;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(62px + env(safe-area-inset-bottom));max-height:44vh;overflow:auto;background:#1c1c1e;border-radius:16px 16px 0 0;padding:4px 12px 12px;z-index:9;box-shadow:0 -10px 30px #000a}
.sh{text-align:center;position:sticky;top:0;background:#1c1c1e;z-index:2}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;display:flex;overflow-x:auto;background:#000;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nb{flex:1 0 64px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:11px;cursor:pointer}
.nb i{font-style:normal;font-size:20px}.nb.on{color:#fff}
label.r{display:grid;grid-template-columns:92px 1fr 40px;gap:6px;align-items:center;margin:7px 0}
label.r span{color:var(--mu)}
label.r input[type=range]{accent-color:var(--ac)}
label.r input[type=text],label.r select{grid-column:2/4;width:100%;background:#0d0d0e;color:#fff;border:1px solid #333;border-radius:6px;padding:6px}
label.r input[type=color]{width:100%;height:30px;border:0;background:none;grid-column:2/4}
output{font-size:11px;color:var(--mu)}
#st{position:fixed;top:54px;left:0;right:0;text-align:center;z-index:20;pointer-events:none}
#st:empty{display:none}
.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50}.mc{background:#1c1c1e;padding:20px;border-radius:16px;width:min(340px,90vw)}.mc h3{margin-bottom:6px}.mc .b{display:block;width:100%;margin:8px 0;padding:12px}
#st{background:#000c;padding:6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="sharp"><feConvolveMatrix order="3" kernelMatrix="0 -.6 0 -.6 3.4 -.6 0 -.6 0" preserveAlpha="true"/></filter></svg>
<div class="top"><span><span class="logo">Naol Editer</span><small id="sv" style="color:#8a8a8e;margin-left:8px"></small></span><div class="tr"><select id="qsel" class="q" aria-label="Export quality"><option value="720" selected>720p</option><option value="1080">1080p HD</option><option value="1440">2K</option><option value="2160">4K Ultra HD</option></select><button class="exp" id="ex">Export</button></div></div>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="ctrl"><span id="tc">0:00 / 0:00</span><button class="ic" id="pp" aria-label="Play">▶</button><span><button class="ic" id="un" aria-label="Undo">↶</button><button class="ic" id="re" aria-label="Redo">↷</button></span></div>
<div class="tlw"><div class="ph"></div><label class="plus" for="file">＋</label><input id="file" type="file" accept="video/*,image/*,audio/*" multiple hidden><div id="sc"><div id="tin"></div></div></div>
<div class="chips act"><button class="b" id="sp">✂ Split</button><button class="b" id="fr">❄ Freeze</button><button class="b" id="sn">📷 Frame</button><button class="b" id="tx">T Add text</button></div>
<div id="st"></div>
<div id="sheet"><div class="sh"><button class="ic" id="cl" aria-label="Close panel">⌄</button></div><div id="pan"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),x=cv.getContext('2d');
let mus=null,clips=[],texts=[],selC=null,selT=null,t=0,playing=false,last=0,cur=null,rec=null,ac,dst,uid=1,tab='clip';
const S={enh:'off',res:'720',asp:'16:9',fps:'30',mb:'16'};
const F0=()=>({br:100,co:100,sa:100,hu:0,bl:0,se:0,gr:0,iv:0});
const C0=()=>({s0:100,s1:100,x0:0,x1:0,y0:0,y1:0,r0:0,r1:0,o0:100,o1:100,ease:'inout',flipX:'no',flipY:'no',fit:'contain',mask:'none',tintA:0,tint:'#ff8a00',vig:0,grain:0,glitch:0,shake:0,pix:0,bars:0,anim:'none',outa:'none'});

const EZ={linear:p=>p,in:p=>p*p,out:p=>1-(1-p)*(1-p),inout:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
const P={bg:'#000000'};
let U=[],Rd=[];
const cl=()=>({c:clips.map(c=>({...c,f:{...c.f}})),t:texts.map(o=>({...o}))});
function save(){U.push(cl());if(U.length>40)U.shift();Rd=[]}
function load(z){clips=z.c.map(c=>({...c,f:{...c.f}}));texts=z.t.map(o=>({...o}));selC=clips[0]||null;selT=texts[0]||null;ui()}
const undo=()=>{if(!U.length)return;Rd.push(cl());load(U.pop())};
const redo=()=>{if(!Rd.length)return;U.push(cl());load(Rd.pop())};
const PRE={Normal:{},'B&W':{gr:100},Noir:{gr:100,co:130},Vintage:{se:60,co:90,sa:80},Vivid:{sa:160,co:115},Cool:{hu:-20,sa:110},Warm:{hu:15,se:25,sa:115},Cinema:{co:125,sa:90,br:92},Fade:{co:80,sa:70,br:110},Sunset:{se:30,hu:-10,sa:150},Teal:{hu:-30,sa:130,co:110},Pastel:{sa:70,br:115}};
const EFX={None:{vig:0,grain:0,glitch:0,shake:0,pix:0,bars:0,tintA:0},Glitch:{glitch:60,shake:10},VHS:{grain:50,glitch:25,tintA:15,tint:'#00e0ff'},Film:{grain:40,vig:40,bars:9},Dreamy:{vig:25,f:{bl:1.5,br:110,sa:120}},Retro:{grain:35,tintA:25,tint:'#ff8a00',vig:30},Mosaic:{pix:12},Shaky:{shake:35},Letterbox:{bars:12,vig:30}};
const INT={None:'none',Slide:'slide',Drop:'drop',Zoom:'zoom',Spin:'spin',Pop:'pop',Bounce:'bounce',Swing:'swing','Fade up':'fadeup'},OUT={None:'none',Fade:'fade',Zoom:'zoom',Slide:'slide',Drop:'drop',Spin:'spin'};
const CAM={Handheld:{shake:20},'Push in':{s0:100,s1:135,ease:'out'},'Pull out':{s0:135,s1:100},Tilt:{r0:-4,r1:4},'Whip pan':{x0:-35,x1:35,ease:'in',s0:120,s1:120},'Punch zoom':{s0:100,s1:125,ease:'out'}};

const VO={Normal:{},Deep:{l:12,h:-10},Bright:{h:10,l:-4},'Bass boost':{l:14},Telephone:{t:'bandpass',f:1200},Radio:{t:'bandpass',f:2500,l:-6},Echo:{w:.5},Cave:{w:.6,dl:.12,fb:.65},Robot:{r:1}};
let sheet=false,bus,fx={},sfx=[];
function AC(){if(ac)return;ac=new AudioContext();dst=ac.createMediaStreamDestination();
 const G=()=>ac.createGain(),B=ty=>{const b=ac.createBiquadFilter();b.type=ty;return b};
 bus=G();fx.low=B('lowshelf');fx.low.frequency.value=200;fx.hi=B('highshelf');fx.hi.frequency.value=3000;fx.bp=B('allpass');
 fx.ring=G();const o=ac.createOscillator();o.frequency.value=50;fx.og=G();fx.og.gain.value=0;o.connect(fx.og);fx.og.connect(fx.ring.gain);o.start();
 fx.dl=ac.createDelay(1);fx.fb=G();fx.wet=G();fx.wet.gain.value=0;fx.dl.delayTime.value=.25;fx.fb.gain.value=.4;
 const out=G();bus.connect(fx.low);fx.low.connect(fx.hi);fx.hi.connect(fx.bp);fx.bp.connect(fx.ring);fx.ring.connect(out);

function voice(v){AC();fx.low.gain.value=v.l||0;fx.hi.gain.value=v.h||0;fx.bp.type=v.t||'allpass';fx.bp.frequency.value=v.f||1000;fx.wet.gain.value=v.w||0;fx.dl.delayTime.value=v.dl||.25;fx.fb.gain.value=v.fb||.4;fx.ring.gain.value=v.r?0:1;fx.og.gain.value=v.r?1:0;panel()}
function sfxPlay(n){AC();ac.resume();const [ty,f0,f1,d]=SFX[n],T0=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(.5,T0);g.gain.exponentialRampToValueAtTime(.001,T0+d);g.connect(bus);let z;
 if(ty=='noise'){const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;z=ac.createBufferSource();z.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0,T0);f.frequency.exponentialRampToValueAtTime(f1,T0+d);z.connect(f);f.connect(g)}
 else{z=ac.createOscillator();z.type=ty;z.frequency.setValueAtTime(f0,T0);z.frequency.exponentialRampToValueAtTime(f1,T0+d);z.connect(g)}z.start(T0);z.stop(T0+d)}
const dur=c=>c.type=='image'?c.len:(c.out-c.in)/c.speed;
const total=()=>clips.reduce((a,c)=>a+dur(c),0);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const rd=()=>{if(!playing)draw()};
function loc(tt){let a=0;for(let i=0;i<clips.length;i++){const c=clips[i],d=dur(c);if(tt<a+d||i==clips.length-1)return{c,lt:Math.min(tt-a,d),d};a+=d}return null}

/* ---------- Media ---------- */
$('#file').onchange=e=>{[...e.target.files].forEach(f=>{const url=URL.createObjectURL(f),id=uid++,fid=Date.now()+'_'+id;idbPut('files',fid,f);
 if(f.type.startsWith('video')){const v=document.createElement('video');v.src=url;v.playsInline=true;v.preload='auto';
  v.onloadedmetadata=()=>add({id,fid,name:f.name,type:'video',el:v,in:0,out:v.duration,speed:1,vol:1,fade:0,f:F0(),...C0()});
  v.onseeked=rd;route(v)}
 else if(f.type.startsWith('audio')){const a=new Audio(url);a.volume=.6;mus={fid,name:f.name,el:a};route(a);tab='audio';sheet=true;ui()}
 else if(f.type.startsWith('image')){const i=new Image();i.onload=()=>add({id,fid,name:f.name,type:'image',el:i,len:3,speed:1,vol:0,fade:0,f:F0(),...C0()});i.src=url}});
 e.target.value=''};
function add(c){save();clips.push(c);selC=c;tab='edit';ui()}

/* ---------- Draw ---------- */
const FS=f=>`brightness(${f.br}%) contrast(${f.co}%) saturate(${f.sa}%) hue-rotate(${f.hu}deg) blur(${f.bl}px) sepia(${f.se}%) grayscale(${f.gr}%) invert(${f.iv||0}%)${S.enh=='on'?' url(#sharp) contrast(105%) saturate(108%)':''}`;
const off=document.createElement('canvas'),ox=off.getContext('2d');
function draw(){const W=cv.width,H=cv.height,R=Math.random;x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';x.fillStyle=P.bg;x.fillRect(0,0,W,H);
 const L=loc(t);
 if(L){const c=L.c,e=c.el;
  if(c.type=='video'&&!playing&&!tracking){const want=c.in+L.lt*c.speed;if(Math.abs(e.currentTime-want)>.03)e.currentTime=want}
  const w=e.videoWidth||e.naturalWidth,h=e.videoHeight||e.naturalHeight;
  if(w){const k=EZ[c.ease](L.d?L.lt/L.d:0),m=(a,b)=>a+(b-a)*k;
   let sc=(c.fit=='cover'?Math.max(W/w,H/h):Math.min(W/w,H/h))*m(c.s0,c.s1)/100,a=m(c.o0,c.o1)/100,dx=m(c.x0,c.x1)*W/100,dy=m(c.y0,c.y1)*H/100,rot=m(c.r0,c.r1)*Math.PI/180;
   if(c.fade>0)a*=Math.max(0,Math.min(1,L.lt/c.fade,(L.d-L.lt)/c.fade));
   const q=Math.min(1,L.lt/.6),eq=1-Math.pow(1-q,3);
   if(c.anim=='slide')dx-=(1-eq)*W;else if(c.anim=='drop')dy-=(1-eq)*H;else if(c.anim=='zoom')sc*=eq;else if(c.anim=='spin'){rot+=(1-eq)*6.28;sc*=eq}else if(c.anim=='pop')sc*=1+Math.sin(q*Math.PI)*.15;else if(c.anim=='bounce')dy-=Math.abs(Math.sin(q*Math.PI*3))*(1-q)*H*.2;else if(c.anim=='swing')rot+=(1-q)*.6*Math.sin(q*14);else if(c.anim=='fadeup'){dy+=(1-eq)*H*.1;a*=eq}
   const q2=Math.min(1,(L.d-L.lt)/.6),e2=1-Math.pow(1-q2,3);if(c.outa=='zoom')sc*=e2;else if(c.outa=='slide')dx+=(1-e2)*W;else if(c.outa=='drop')dy+=(1-e2)*H;else if(c.outa=='spin'){rot-=(1-e2)*6.28;sc*=e2}else if(c.outa=='fade')a*=e2;
   const ll=L.lt;if(c.loop=='pulse')sc*=1+.05*Math.sin(ll*6);else if(c.loop=='wobble')rot+=.05*Math.sin(ll*5);else if(c.loop=='float')dy+=Math.sin(ll*3)*H*.01;else if(c.loop=='beat')sc*=1+.08*Math.max(0,Math.sin(ll*8));
   if(c.shake){dx+=(R()-.5)*c.shake*W/300;dy+=(R()-.5)*c.shake*H/300}
   const tp=c.trk?trkAt(c,L.lt):c._seed,fxs=c.flipX=='yes'?-1:1,fys=c.flipY=='yes'?-1:1;
   if(tp){const fol=c.trk&&c.follow=='on';if(fol)sc*=(c.fz||150)/100;const vx=(tp.x-.5)*w*sc*fxs,vy=(tp.y-.5)*h*sc*fys,co=Math.cos(rot),si=Math.sin(rot),ox=vx*co-vy*si,oy=vx*si+vy*co;if(fol){dx-=ox;dy-=oy}c._pt={x:W/2+dx+ox,y:H/2+dy+oy};c._pr=(tp.s||.12)*w*sc*.6*(c.cr||100)/100}else c._pt=null;
   c._xf={sc,dx,dy,rot,fxs,fys,w,h};
   if(c.bgm=='blur'){x.filter='blur(24px) brightness(70%)';const sb=Math.max(W/w,H/h)*1.1;x.drawImage(e,(W-w*sb)/2,(H-h*sb)/2,w*sb,h*sb);x.filter='none'}
   x.save();x.translate(W/2+dx,H/2+dy);x.rotate(rot);x.scale(sc*(c.flipX=='yes'?-1:1),sc*(c.flipY=='yes'?-1:1));
   if(c.mask!='none'){x.beginPath();const r=Math.min(w,h)/2;if(c.mask=='circle')x.arc(0,0,r,0,7);else if(c.mask=='rounded')x.roundRect(-w/2,-h/2,w,h,Math.min(w,h)*.15);else x.rect(-w/2,-h*.3,w,h*.6);x.clip()}
   x.filter=FS(c.f);x.globalAlpha=Math.max(0,a);
   if(c.pix>0){const pw=Math.max(8,Math.round(w/(1+c.pix))),ph=Math.max(8,Math.round(h/(1+c.pix)));off.width=pw;off.height=ph;ox.drawImage(e,0,0,pw,ph);x.imageSmoothingEnabled=false;x.drawImage(off,-w/2,-h/2,w,h);x.imageSmoothingEnabled=true}

    x.globalCompositeOperation='screen';x.globalAlpha=.35;x.filter='hue-rotate(120deg)';x.drawImage(e,-w/2+c.glitch/3,-h/2,w,h);x.globalCompositeOperation='source-over'}
   x.restore();x.filter='none';x.globalAlpha=1}
  if(c.trk&&c.cover&&c.cover!='none'&&c._pt){const q0=c._pt,r=Math.max(8,c._pr||40);
   if(c.cover=='emoji'){x.font=`${r*2}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(c.emoji||'😎',q0.x,q0.y)}
   else{x.save();x.beginPath();x.arc(q0.x,q0.y,r,0,7);x.clip();if(c.cover=='blur'){x.filter='blur('+r/4+'px)';x.drawImage(cv,0,0)}else{off.width=8;off.height=8;ox.drawImage(cv,q0.x-r,q0.y-r,2*r,2*r,0,0,8,8);x.imageSmoothingEnabled=false;x.drawImage(off,q0.x-r,q0.y-r,2*r,2*r);x.imageSmoothingEnabled=true}x.restore()}}
  if(c.tintA){x.globalCompositeOperation='overlay';x.globalAlpha=c.tintA/100;x.fillStyle=c.tint;x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';x.globalAlpha=1}
  if(c.vig){const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.hypot(W,H)*.55);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${c.vig/100})`);x.fillStyle=g;x.fillRect(0,0,W,H)}

 else if(k=='edit'){if(!L)return;selC=L.c;csel=true;sheet=false}
 else if(k=='split'){split();return}
 else if(k=='rot'){save();c.r0=c.r1=((c.r0||0)+90)%360}
 else if(k=='mirror'){save();c.flipX=c.flipX=='yes'?'no':'yes'}
 else if(k=='freeze'){freeze();return}
 else if(k=='dup'){dup();return}
 else if(k=='del'){del();csel=false;sheet=false}
 else{if(!csel&&['fx','filt','track'].includes(k)&&L)selC=L.c;if(sheet&&tab==k)sheet=false;else{tab=k;sheet=true}}
 ui()}

 else if(tab=='anim'){hd('Intro');chips(INT,v=>{save();c.anim=v;panel();prev()});hd('Outro');chips(OUT,v=>{save();c.outa=v;panel();prev()});hd('Loop');chips(LOOP,v=>{save();c.loop=v;panel();prev()});hd('Camera moves');chips(CAM,v=>{save();Object.assign(c,RS,v);panel();prev()});hd('Keyframes');chips(MOT,v=>{save();Object.assign(c,RS,v);panel();prev()});fld(p,'Easing',c,'ease','',Object.keys(EZ))}
 else if(tab=='adj'){hd('Adjust');[['br','Brightness',0,200],['co','Contrast',0,200],['sa','Saturation',0,300],['hu','Hue',-180,180],['bl','Blur',0,20],['se','Sepia',0,100],['gr','Black & white',0,100],['iv','Invert',0,100]].forEach(([k,l,a,b])=>sl(p,l,c.f,k,a,b,1));btn(p,'Reset',()=>{save();c.f=F0();panel();rd()})}
 else if(tab=='mask'){hd('Mask');chips({None:'none',Circle:'circle',Rounded:'rounded',Wide:'wide'},v=>{save();c.mask=v;rd()})}
 else if(tab=='crop'){hd('Crop & transform');fld(p,'Fit',c,'fit','',['contain','cover']);sl2(p,'Zoom %',()=>c.s0,v=>{c.s0=c.s1=v},20,300,1);sl2(p,'Position X',()=>c.x0,v=>{c.x0=c.x1=v},-100,100,1);sl2(p,'Position Y',()=>c.y0,v=>{c.y0=c.y1=v},-100,100,1);sl2(p,'Rotate',()=>c.r0,v=>{c.r0=c.r1=v},-180,180,1);sl2(p,'Opacity',()=>c.o0,v=>{c.o0=c.o1=v},0,100,1);fld(p,'Flip X',c,'flipX','',['no','yes']);fld(p,'Flip Y',c,'flipY','',['no','yes'])}

 else{if(c.type!='video')return p.append(el('<p class=m>Tracking works on video clips.</p>'));c.tk=c.tk||'face';
  hd('What to track');chips(Object.fromEntries(Object.entries(TK).map(([n,v])=>[n+(c.tk==v?' ✓':''),v])),v=>{c.tk=v;panel()});

  const r=el('<div class=chips></div>');btn(r,'▶ Start tracking',()=>trackClip(c));if(c.trk)btn(r,'✕ Clear',()=>{c.trk=null;c.follow='off';c.cover='none';panel();rd()});p.append(r);
  if(c.trk){c.fz=c.fz||150;c.cr=c.cr||100;hd('Camera');fld(p,'Camera follow',c,'follow','',['off','on']);sl(p,'Follow zoom %',c,'fz',100,300,5);
   hd('Cover target');chips({None:'none',Blur:'blur',Mosaic:'mosaic',Emoji:'emoji'},v=>{save();c.cover=v;rd()});sl(p,'Cover size %',c,'cr',30,300,5);fld(p,'Emoji',c,'emoji','',['😎','😀','🙈','⭐','❤️','🔥']);
   hd('Attach');btn(p,'＋ Text on target',()=>{addT();selT.track='on';selT.x=50;selT.y=40;tab='track';ui()});btn(p,'＋ Sticker on target',()=>{addT();Object.assign(selT,{text:'😎',size:16,style:'plain',anim:'pop',font:'Arial',track:'on',x:50,y:50});tab='track';ui()});if(selT)fld(p,'Selected text',selT,'track','',['off','on'])}}}
/* ---------- AI tracking (MediaPipe) ---------- */
let MPm,MPfs,MPd={};
async function mp(kind){const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';if(!MPm){MPm=await import(V+'/vision_bundle.mjs');MPfs=await MPm.FilesetResolver.forVisionTasks(V+'/wasm')}
 if(!MPd[kind]){const B='https://storage.googleapis.com/mediapipe-models/',U={face:B+'face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',hand:B+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',body:B+'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',obj:B+'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite'},C={face:MPm.FaceDetector,hand:MPm.HandLandmarker,body:MPm.PoseLandmarker,obj:MPm.ObjectDetector};
  MPd[kind]=await C[kind].createFromOptions(MPfs,{baseOptions:{modelAssetPath:U[kind]},runningMode:'IMAGE'})}return MPd[kind]}
function det(k,d,e){const W0=e.videoWidth,H0=e.videoHeight;
 if(k=='face'||k=='obj'){const r=d.detect(e).detections[0];if(!r)return null;const b=r.boundingBox;return{x:(b.originX+b.width/2)/W0,y:(b.originY+b.height/2)/H0,s:b.width/W0}}
 const l=d.detect(e).landmarks[0];if(!l)return null;const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 if(k=='hand')return{x:l[9].x,y:l[9].y,s:D(l[0],l[9])*1.6};
 if(k=='head')return{x:l[0].x,y:l[0].y,s:D(l[7],l[8])*2};
 return{x:(l[11].x+l[12].x+l[23].x+l[24].x)/4,y:(l[11].y+l[12].y+l[23].y+l[24].y)/4,s:D(l[11],l[12])*1.5}}
const smooth=a=>{for(let k=0;k<2;k++){const b=a.map((p,i)=>{const u=a[i-1]||p,v=a[i+1]||p;return{...p,x:(u.x+p.x+v.x)/3,y:(u.y+p.y+v.y)/3,s:p.s&&(u.s+p.s+v.s)/3}});b.forEach((p,i)=>a[i]=p)}};
async function trackClip(c){if(tracking)return;const k=c.tk||'face';if(k=='tap')return trackTap(c);
 tracking=true;pause();const e=c.el,D=dur(c),st=.1,L0=loc(t)?loc(t).lt:0;
 try{say('Loading tracker… (internet needed the first time)');const d=await mp({head:'body',torso:'body'}[k]||k),a=[];let last=null;
  for(let lt=0;lt<=D;lt+=st){await seekV(e,c.in+lt*c.speed);const r=det(k,d,e)||last;if(r){a.push({t:c.in+lt*c.speed,...r});last=r}say('Tracking… '+Math.round(lt/D*100)+'%')}
  if(!a.length)throw new Error('target not found');smooth(a);c.trk=a;c.follow=c.follow||'off';say('Tracking done ✓')}
 catch(err){say('Tracking failed: '+(err.message||err)+'. Check internet, or use Tap point.')}
 tracking=false;await seekV(e,c.in+L0*c.speed);setTimeout(()=>say(''),2500);panel();rd()}
/* ---------- Tracking ---------- */
let tracking=false;const say=m=>{$('#st').textContent=m};
const tc=document.createElement('canvas'),tx=tc.getContext('2d',{willReadFrequently:true});
const seekV=(v,ts)=>new Promise(ok=>{const f=()=>{v.removeEventListener('seeked',f);ok()};v.addEventListener('seeked',f);v.currentTime=ts;setTimeout(f,800)});
function gray(v,TW,TH){tc.width=TW;tc.height=TH;tx.drawImage(v,0,0,TW,TH);const d=tx.getImageData(0,0,TW,TH).data,g=new Float32Array(TW*TH);for(let i=0;i<g.length;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;return g}
function trkAt(c,lt){const a=c.trk;if(!a||!a.length)return null;const ts=c.in+lt*c.speed;if(ts<=a[0].t)return a[0];for(let i=1;i<a.length;i++)if(ts<=a[i].t){const p=a[i-1],q=a[i],k=(ts-p.t)/(q.t-p.t||1);return{x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k,s:p.s&&p.s+(q.s-p.s)*k}}return a[a.length-1]}
async function trackTap(c){if(tracking)return;if(!c._seed)return say('Tap the object on the preview first.');
 tracking=true;pause();const e=c.el,TW=192,TH=Math.round(TW*e.videoHeight/e.videoWidth),R=7,SR=16,D=dur(c),st=.08,L0=loc(t).lt;
 const run=async dir=>{const out=[];await seekV(e,c.in+L0*c.speed);let pg=gray(e,TW,TH),px=Math.round(c._seed.x*TW),py=Math.round(c._seed.y*TH);
  for(let lt=L0+dir*st;lt>=0&&lt<=D;lt+=dir*st){await seekV(e,c.in+lt*c.speed);const g=gray(e,TW,TH);let best=1e18,bx=px,by=py;
   for(let dy=-SR;dy<=SR;dy++)for(let dx=-SR;dx<=SR;dx++){const cx=px+dx,cy=py+dy;if(cx<R||cy<R||cx>=TW-R||cy>=TH-R)continue;let sad=0;for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++)sad+=Math.abs(g[(cy+j)*TW+cx+i]-pg[(py+j)*TW+px+i]);if(sad<best){best=sad;bx=cx;by=cy}}
   px=bx;py=by;pg=g;out.push({t:c.in+lt*c.speed,x:px/TW,y:py/TH});say('Tracking… '+Math.round(Math.abs(lt-L0)/D*100)+'%')}
  return out};
 const fw=await run(1),bw=await run(-1);
 let a=[...bw.reverse(),{t:c.in+L0*c.speed,x:c._seed.x,y:c._seed.y},...fw];
 for(let k=0;k<2;k++)a=a.map((p,i)=>{const u=a[i-1]||p,v=a[i+1]||p;return{t:p.t,x:(u.x+p.x+v.x)/3,y:(u.y+p.y+v.y)/3}});
 c.trk=a;c.follow=c.follow||'off';tracking=false;await seekV(e,c.in+L0*c.speed);say('Tracking done ✓');setTimeout(()=>say(''),1500);panel();rd()}
cv.addEventListener('click',e=>{if(!(sheet&&tab=='track'))return;const L=loc(t);if(!L||L.c.type!='video'||!L.c._xf)return;const c=L.c,X=c._xf,r=cv.getBoundingClientRect(),W=cv.width,H=cv.height,
 px=(e.clientX-r.left)/r.width*W-W/2-X.dx,py=(e.clientY-r.top)/r.height*H-H/2-X.dy,co=Math.cos(-X.rot),si=Math.sin(-X.rot),ux=px*co-py*si,uy=px*si+py*co;
 c._seed={x:ux/(X.w*X.sc*X.fxs)+.5,y:uy/(X.h*X.sc*X.fys)+.5};selC=c;pause();draw();panel()});
/* ---------- Auto-save project (IndexedDB) ---------- */
const DB=new Promise((ok,no)=>{const q=indexedDB.open('naol',1);q.onupgradeneeded=()=>{q.result.createObjectStore('files');q.result.createObjectStore('proj')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idb=(st,mode,fn)=>DB.then(d=>new Promise((ok,no)=>{const q=fn(d.transaction(st,mode).objectStore(st));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const idbPut=(st,k,v)=>idb(st,'readwrite',o=>o.put(v,k)).catch(()=>{}),idbGet=(st,k)=>idb(st,'readonly',o=>o.get(k)).catch(()=>null),idbClear=st=>idb(st,'readwrite',o=>o.clear()).catch(()=>{});
let ready=false;
function saveProj(){if(!ready)return;idbPut('proj','cur',{t,time:Date.now(),S,P,sfx,mus:mus?{fid:mus.fid,name:mus.name,vol:mus.el.volume}:null,texts,clips:clips.map(({el,...c})=>c)}).then(()=>{$('#sv').textContent='✓ Saved'})}
setInterval(saveProj,2500);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProj()});addEventListener('pagehide',saveProj);
async function restore(pr){
 const mk=async c=>{const b=await idbGet('files',c.fid);if(!b)return null;const url=URL.createObjectURL(b);
  if(c.type=='video')return new Promise(ok=>{const v=document.createElement('video');v.src=url;v.playsInline=true;v.preload='auto';v.onloadeddata=rd;v.onloadedmetadata=()=>{v.onseeked=rd;route(v);ok({...c,el:v})};v.onerror=()=>ok(null)});
  return new Promise(ok=>{const i=new Image();i.onload=()=>ok({...c,el:i});i.onerror=()=>ok(null);i.src=url})};
 clips=(await Promise.all(pr.clips.map(mk))).filter(Boolean);texts=pr.texts||[];sfx=pr.sfx||[];Object.assign(S,pr.S);Object.assign(P,pr.P);
 if(pr.mus){const b=await idbGet('files',pr.mus.fid);if(b){const a=new Audio(URL.createObjectURL(b));a.volume=pr.mus.vol;mus={fid:pr.mus.fid,name:pr.mus.name,el:a};route(a)}}
 selC=clips[0]||null;selT=texts[0]||null;t=Math.min(pr.t||0,total());$('#qsel').value=S.res;size();ui()}
async function newProj(){pause();if(mus)mus.el.pause();await idbClear('files');await idbClear('proj');clips=[];texts=[];sfx=[];mus=null;selC=selT=null;t=0;U=[];Rd=[];ready=true;ui()}
(async()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();const pr=await idbGet('proj','cur');
 if(pr&&pr.clips&&pr.clips.length){const m=el('<div class="modal"><div class="mc"><h3>Welcome back</h3></div></div>'),mc=m.firstElementChild,n=el('<p class=m></p>');n.textContent=pr.clips.length+' clip(s), last saved '+new Date(pr.time).toLocaleString();mc.append(n);
  btn(mc,'▶ Resume project',async()=>{m.remove();await restore(pr);ready=true});btn(mc,'＋ New project',async()=>{m.remove();await newProj()});document.body.append(m)}else ready=true})();
size();ui();
